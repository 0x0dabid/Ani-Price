<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ani-Price | Crypto Prices</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #e8e8f8;
  --border: #3a3acc;
  --border-light: #7777cc;
  --header-bg: linear-gradient(180deg, #c8c8f0 0%, #b0b0e8 100%);
  --green: #00cc55;
  --red: #dd2233;
  --yellow: #ffcc00;
  --card-bg: #f4f4ff;
  --text-dark: #1a1a3a;
  --accent-blue: #3344dd;
  --glow-green: #00ff88;
  --panel-bg: linear-gradient(135deg, #e0e0f8 0%, #d0d0f0 50%, #c8c8ec 100%);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Nunito',sans-serif; background:var(--bg); color:var(--text-dark); min-height:100vh; }

/* ===== HEADER ===== */
.header {
  background: var(--header-bg);
  border: 3px solid var(--border);
  border-bottom: 4px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 20px; gap: 12px;
  box-shadow: 0 2px 8px rgba(50,50,150,0.15);
}
.logo {
  font-family: 'Fredoka One', cursive;
  font-size: 1.6rem;
  background: linear-gradient(180deg, #ff6644 0%, #ff3388 40%, #cc2266 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  text-shadow: none;
  filter: drop-shadow(1px 2px 0px rgba(0,0,0,0.2));
  letter-spacing: -0.5px;
  cursor: pointer;
}
.mcap-info { font-size:0.85rem; color:#555; font-weight:700; }
.mcap-info .val { color:#cc6600; font-weight:900; }
.mcap-info .chg { color:var(--green); font-weight:800; }
.header-right { display:flex; align-items:center; gap:10px; }
.header-nav a { color:#333; text-decoration:none; font-weight:800; font-size:0.95rem; }
.sign-in-btn {
  background: linear-gradient(180deg, #ffcc44, #ffaa22);
  color: #333; padding: 6px 18px; border-radius: 6px;
  font-weight: 900; font-size: 0.85rem;
  border: 2px solid #cc8800; cursor: pointer;
  text-decoration: none; display: inline-block;
  box-shadow: 0 2px 0 #aa7700;
  transition: transform 0.1s;
}
.sign-in-btn:hover { transform: translateY(-1px); }
.view-toggle { display:flex; }
.vbtn {
  padding:4px 12px; font-family:'Nunito',sans-serif; font-weight:800; font-size:0.7rem;
  border:2px solid var(--border-light); background:#ddddf8; color:#888; cursor:pointer;
  transition: all 0.15s; letter-spacing:0.5px;
}
.vbtn:first-child { border-radius:4px 0 0 4px; }
.vbtn:last-child { border-radius:0 4px 4px 0; }
.vbtn.active { background:var(--accent-blue); color:#fff; border-color:var(--accent-blue); }

/* ===== PAGES ===== */
.page { display:none; }
.page.active { display:block; }

/* ===== HOME PAGE ===== */
.watchlist-section {
  margin:16px 20px; border:3px solid var(--border); border-radius:8px;
  background: var(--card-bg); overflow:hidden;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.5), 0 3px 10px rgba(50,50,150,0.1);
}
.watchlist-label {
  background: linear-gradient(90deg, #ddddf8, #e8e8ff);
  padding:7px 14px; font-weight:900; font-size:0.8rem; letter-spacing:1px;
  border-bottom:2px solid var(--border); color:#555;
}
.watchlist-body { display:flex; }
.watchlist-left { flex:1; padding:16px 20px; min-width:0; }
.watchlist-right {
  width:280px; border-left:2px solid var(--border);
  display:flex; flex-direction:column; overflow:hidden;
  transition: width 0.3s, opacity 0.25s;
}
.watchlist-right.hidden { width:0; border-left-width:0; opacity:0; pointer-events:none; }

.coin-head { display:flex; align-items:center; gap:10px; margin-bottom:2px; }
.ci { width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1rem;color:#fff;flex-shrink:0; }
.ci.btc{background:linear-gradient(135deg,#f7931a,#e8860a)}.ci.eth{background:linear-gradient(135deg,#627eea,#4a6bd6)}.ci.bnb{background:linear-gradient(135deg,#f3ba2f,#e0a800)}.ci.sol{background:linear-gradient(135deg,#9945ff,#14f195)}.ci.xrp{background:linear-gradient(135deg,#2a2a2a,#555)}.ci.ada{background:linear-gradient(135deg,#0033ad,#0055ff)}.ci.doge{background:linear-gradient(135deg,#c2a633,#ba9f33)}.ci.avax{background:linear-gradient(135deg,#e84142,#c0292a)}.ci.dot{background:linear-gradient(135deg,#e6007a,#cc006b)}.ci.link{background:linear-gradient(135deg,#2a5ada,#1e4ac0)}
.coin-head h2 { font-size:1.4rem; font-weight:800; }
.wprice {
  font-family:'Fredoka One',cursive; font-size:2.6rem;
  color:var(--yellow); text-shadow:2px 2px 0 #cc9900,3px 3px 0 rgba(0,0,0,0.08);
  line-height:1.1;
}
.wchange { font-size:1rem; font-weight:800; margin-left:8px; }
.wchange.up{color:var(--green)}.wchange.down{color:var(--red)}
.wchange .per{color:#888;font-weight:600}

.mchart { width:100%;height:160px;margin-top:12px;border-radius:4px;overflow:hidden; }
.mchart canvas { width:100%;height:100%; }
.cdates { display:flex;justify-content:space-between;padding:4px 0 0;font-size:0.75rem;color:#999;font-weight:700; }

/* Side panel rows */
.sr { display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid #e0e0f0;cursor:pointer;transition:background 0.15s;white-space:nowrap; }
.sr:hover{background:#f0f0ff}.sr.act{background:#e8e8ff}
.sr:last-child{border-bottom:none}
.sr-left{display:flex;align-items:center;gap:8px}
.sr-icon{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:0.75rem;color:#fff}
.sr-info{display:flex;flex-direction:column}
.sr-sym{font-weight:900;font-size:0.9rem}.sr-mc{font-size:0.7rem;color:#999;font-weight:700}
.sr-price{font-weight:900;font-size:1.05rem}
.sr-price.g{color:var(--green)}.sr-price.b{color:var(--accent-blue)}.sr-price.r{color:var(--red)}

/* TABLE */
.tsec {
  margin:16px 20px; border:3px solid var(--border); border-radius:8px;
  background:var(--card-bg); overflow:hidden;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.5), 0 3px 10px rgba(50,50,150,0.1);
}
.ttabs { display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:2px solid var(--border);background:#f6f6ff; }
.tbtn { padding:6px 18px;font-weight:800;font-size:0.85rem;border:2px solid var(--accent-blue);background:var(--accent-blue);color:#fff;border-radius:6px;font-family:'Nunito',sans-serif; }
.tr-right{display:flex;align-items:center;gap:8px}
.sbox{padding:7px 12px;border:2px solid #ccc;border-radius:6px;font-size:0.8rem;font-family:'Nunito',sans-serif;font-weight:600;width:180px;outline:none}
.sbox:focus{border-color:var(--accent-blue)}
.cmpbtn{padding:7px 16px;background:var(--accent-blue);color:#fff;border:2px solid #4455dd;border-radius:6px;font-weight:800;font-size:0.8rem;cursor:pointer;font-family:'Nunito',sans-serif}
table.ct{width:100%;border-collapse:collapse}
.ct thead th{text-align:left;padding:10px 14px;font-weight:800;font-size:0.8rem;color:#777;border-bottom:2px solid #eee;background:#fafafe}
.ct tbody tr{border-bottom:1px solid #f0f0f0;cursor:pointer;transition:background 0.12s}
.ct tbody tr:hover{background:#f4f4ff}
.ct tbody td{padding:12px 14px;font-weight:700;font-size:0.9rem}
.rn{font-weight:900;color:#999;width:20px;display:inline-block}
.ea{color:#ccc;margin:0 5px;font-size:0.6rem}
.cnc{display:flex;align-items:center;gap:8px}
.cnc .ci{width:28px;height:28px;font-size:0.75rem}
.cnt{font-weight:800;font-size:0.95rem}
.chc{font-weight:800;display:flex;align-items:center;gap:3px}
.chc.up{color:var(--green)}.chc.down{color:var(--red)}
.mc{font-weight:700;color:#666}
.slc{width:90px;height:28px}.slc svg{width:100%;height:100%}

/* ===== DETAIL PAGE ===== */
.detail-card {
  margin:16px 20px; border:3px solid var(--border); border-radius:10px;
  background: var(--panel-bg);
  overflow:hidden;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.6), 0 4px 16px rgba(50,50,150,0.12);
}
.detail-top { padding:16px 20px; }
.detail-head { display:flex; align-items:center; justify-content:space-between; }
.detail-coin { display:flex; align-items:center; gap:12px; }
.detail-coin .ci { width:48px;height:48px;font-size:1.3rem; }
.detail-name { font-size:1.5rem; font-weight:900; }
.detail-sym { font-size:0.85rem; color:#888; font-weight:700; }
.detail-actions { display:flex; gap:8px; }
.detail-act {
  width:36px;height:36px;border:2px solid var(--border-light);border-radius:6px;
  background:#fff;display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:1rem;transition:background 0.15s;
}
.detail-act:hover{background:#eef}
.detail-price-row { display:flex;align-items:baseline;gap:12px;margin-top:8px; }
.detail-price {
  font-family:'Fredoka One',cursive; font-size:2.8rem;
  background: linear-gradient(180deg, #ffdd44 0%, #ff9922 100%);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  filter:drop-shadow(2px 2px 0 rgba(200,130,0,0.3));
  line-height:1.1;
}
.detail-badge {
  padding:5px 16px; border-radius:20px; font-weight:900; font-size:0.95rem;
  display:inline-flex;align-items:center;
}
.detail-badge.up { background:#00cc55; color:#fff; }
.detail-badge.down { background:#dd2233; color:#fff; }

/* Time range selector */
.time-range { display:flex;gap:0;margin-top:14px;margin-bottom:10px; }
.tr-btn {
  padding:6px 16px; font-family:'Nunito',sans-serif; font-weight:800; font-size:0.8rem;
  border:2px solid var(--border-light); background:#e0e0f4; color:#888;
  cursor:pointer; transition:all 0.15s;
}
.tr-btn:first-child{border-radius:6px 0 0 6px}
.tr-btn:last-child{border-radius:0 6px 6px 0}
.tr-btn.active { background:var(--accent-blue); color:#fff; border-color:var(--accent-blue); }
.tr-btn:hover:not(.active){background:#d0d0ee;color:#555}

.chart-controls { display:flex;align-items:center;justify-content:space-between;margin-bottom:4px; }
.chart-mode { display:flex;gap:0; }
.cm-btn {
  padding:4px 12px;font-family:'Nunito',sans-serif;font-weight:800;font-size:0.75rem;
  border:2px solid var(--border-light);background:#fff;color:#888;cursor:pointer;
}
.cm-btn:first-child{border-radius:4px 0 0 4px}.cm-btn:last-child{border-radius:0 4px 4px 0}
.cm-btn.active{background:var(--accent-blue);color:#fff;border-color:var(--accent-blue)}

/* Detail Chart */
.detail-chart-wrap {
  position:relative; width:100%; height:320px;
  border:2px solid var(--border); border-radius:8px;
  background: linear-gradient(180deg, #1a1a3a 0%, #0a2a2a 100%);
  overflow:hidden;
}
.detail-chart-canvas { width:100%;height:100%; }

/* Grid overlay */
.chart-grid {
  position:absolute;top:0;left:0;right:0;bottom:0;
  pointer-events:none;
}

/* Price axis on right */
.price-axis {
  position:absolute;top:0;right:0;bottom:30px;width:60px;
  display:flex;flex-direction:column;justify-content:space-between;
  padding:8px 4px;pointer-events:none;
}
.price-tick {
  font-family:'Orbitron',monospace;font-size:0.55rem;color:rgba(0,255,136,0.5);
  text-align:right;font-weight:700;
}

/* Current price label */
.price-now {
  position:absolute;right:0;
  background:#00cc55;color:#fff;
  padding:2px 8px;border-radius:3px;
  font-family:'Orbitron',monospace;font-size:0.65rem;font-weight:900;
  box-shadow:0 0 8px rgba(0,255,100,0.4);
}

/* Time axis */
.time-axis {
  position:absolute;bottom:0;left:0;right:60px;height:28px;
  display:flex;justify-content:space-between;align-items:center;
  padding:0 12px;pointer-events:none;
}
.time-tick {
  font-family:'Orbitron',monospace;font-size:0.55rem;color:rgba(0,255,136,0.4);font-weight:700;
}

/* Crosshair */
.crosshair-v {
  position:absolute;top:0;bottom:28px;width:1px;
  border-left:1px dashed rgba(0,200,255,0.4);
  pointer-events:none;display:none;
}
.crosshair-label {
  position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);
  background:rgba(30,30,80,0.9);color:#aaf;padding:1px 6px;border-radius:3px;
  font-family:'Orbitron',monospace;font-size:0.55rem;font-weight:700;white-space:nowrap;
}

/* KEY STATS */
.key-stats {
  margin:16px 20px; border:3px solid var(--border); border-radius:10px;
  background:var(--panel-bg); overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,0.6),0 3px 10px rgba(50,50,150,0.1);
}
.ks-label {
  background:linear-gradient(90deg,#ff44aa,#ff6688);
  padding:6px 14px;font-weight:900;font-size:0.8rem;color:#fff;letter-spacing:1px;
}
.ks-grid {
  display:grid;grid-template-columns:repeat(6,1fr);gap:0;padding:12px;
}
.ks-item {
  border:2px solid var(--border-light);border-radius:8px;
  background:linear-gradient(180deg,#e8e8ff,#d8d8f4);
  padding:12px 10px;text-align:center;margin:4px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.7);
}
.ks-title { font-size:0.65rem;font-weight:800;color:#888;letter-spacing:0.5px;margin-bottom:4px; }
.ks-value { font-family:'Fredoka One',cursive;font-size:1.1rem;color:var(--text-dark); }
.ks-sub { font-size:0.65rem;color:#999;font-weight:700;margin-top:2px; }
.ks-sub.red{color:var(--red)}.ks-sub.green{color:var(--green)}

.back-btn {
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 18px;background:#fff;border:2px solid var(--border-light);
  border-radius:8px;font-weight:800;font-size:0.85rem;cursor:pointer;
  margin:16px 20px 0;transition:all 0.15s;font-family:'Nunito',sans-serif;
  color:var(--text-dark);
}
.back-btn:hover{background:#f0f0ff;border-color:var(--accent-blue)}

.footer { text-align:center;padding:20px;color:#aaa;font-size:0.75rem;font-weight:700; }

@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.anim{animation:slideUp 0.4s ease-out}

@media(max-width:768px){
  .header{flex-wrap:wrap;padding:8px 10px}
  .watchlist-body{flex-direction:column}
  .watchlist-right{width:100%!important;border-left:none!important;border-top:2px solid var(--border)}
  .watchlist-right.hidden{height:0;border-top:none}
  .wprice,.detail-price{font-size:2rem}
  .ks-grid{grid-template-columns:repeat(3,1fr)}
  .detail-chart-wrap{height:220px}
  .tsec,.watchlist-section,.detail-card,.key-stats{margin:10px 8px}
  .slc{display:none}
}
</style>
</head>

<script>
// ==================== DEXSCREENER API ====================
const API = 'https://api.dexscreener.com';

async function apiFetch(path) {
  const resp = await fetch(API + path);
  if (!resp.ok) throw new Error('API error ' + resp.status);
  return resp.json();
}

function fmtVol(v) {
  if (v == null) return 'N/A';
  if (v >= 1e12) return '$' + (v/1e12).toFixed(2) + 'T';
  if (v >= 1e9) return '$' + (v/1e9).toFixed(2) + 'B';
  if (v >= 1e6) return '$' + (v/1e6).toFixed(2) + 'M';
  if (v >= 1e3) return '$' + (v/1e3).toFixed(2) + 'K';
  return '$' + v.toFixed(2);
}

function fmtPrice(v) {
  if (v == null) return 'N/A';
  var n = parseFloat(v);
  if (isNaN(n)) return 'N/A';
  if (n >= 1) return '$' + n.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
  if (n >= 0.0001) return '$' + n.toFixed(6);
  return '$' + n.toExponential(2);
}

// Pick highest-liquidity pair from a set of search results for a given symbol
function bestPairForSymbol(pairs, symbol) {
  var matching = pairs.filter(function(p) {
    var bs = ((p.baseToken || {}).symbol || '').toUpperCase();
    return bs === symbol.toUpperCase() || bs === 'W' + symbol.toUpperCase();
  });
  if (!matching.length) matching = pairs;
  matching.sort(function(a, b) {
    return (((b.liquidity || {}).usd) || 0) - (((a.liquidity || {}).usd) || 0);
  });
  return matching[0] || null;
}

// ==================== FETCH LIVE PRICES ====================
async function fetchAllPrices() {
  var promises = coins.map(function(coin) {
    return apiFetch('/latest/dex/search?q=' + encodeURIComponent(coin.search))
      .then(function(data) {
        var pairs = data.pairs || [];
        var best = bestPairForSymbol(pairs, coin.symbol);
        if (best) {
          coin.price = parseFloat(best.priceUsd) || 0;
          coin.change = ((best.priceChange || {}).h24) || 0;
          coin.trend = coin.change >= 0 ? 'up' : 'down';
          coin.mcap = fmtVol(best.marketCap);
          coin.fdv = fmtVol(best.fdv);
          coin.vol = fmtVol(((best.volume || {}).h24) || 0);
          coin.volH24 = ((best.volume || {}).h24) || 0;
          coin.liq = fmtVol(((best.liquidity || {}).usd) || 0);
          coin.pair = best;
        }
      })
      .catch(function() { /* skip failed fetches */ });
  });
  await Promise.all(promises);

  // Re-sort by market cap (approximate from pair data)
  coins.sort(function(a, b) {
    var aMcap = a.pair ? (a.pair.marketCap || 0) : 0;
    var bMcap = b.pair ? (b.pair.marketCap || 0) : 0;
    return bMcap - aMcap;
  });
  coins.forEach(function(c, i) { c.rank = i + 1; });

  displayCoins = coins;
  isShowingSearch = false;
  renderTable(coins);
  buildSide();
  setWatch(currentWatch);
}

// ==================== HOME PAGE ====================
function goHome() {
  document.getElementById('homePage').classList.add('active');
  document.getElementById('detailPage').classList.remove('active');

function setView(m) {
  currentView = m;
  document.getElementById('bFull').classList.toggle('active', m === 'full');
  document.getElementById('bSplit').classList.toggle('active', m === 'split');
  var p = document.getElementById('sidePanel');
  m === 'split' ? p.classList.remove('hidden') : p.classList.add('hidden');
  setTimeout(function() { drawHomeChart(); }, 60);
}

function buildSide() {
  var p = document.getElementById('sidePanel');
  var cols = ['b', 'g', 'r', 'g', 'b'];
  p.innerHTML = coins.slice(0, 5).map(function(c, i) {
    var priceStr = c.price >= 1000
      ? '$' + c.price.toLocaleString('en-US', {maximumFractionDigits: 0})
      : fmtPrice(c.price);
    return '<div class="sr ' + (c.name.toLowerCase() === currentWatch ? 'act' : '') + '" onclick="setWatch(\'' + c.name.toLowerCase() + '\')">' +
      '<div class="sr-left">' +
        '<div class="sr-icon ci ' + c.cls + '">' + c.icon + '</div>' +
        '<div class="sr-info"><span class="sr-sym">' + c.symbol + '</span><span class="sr-mc">' + c.mcap + '</span></div>' +
      '</div>' +
      '<div class="sr-price ' + cols[i] + '">' + priceStr + '</div>' +
    '</div>';
  }).join('');
}

function setWatch(id) {
  currentWatch = id;
  var c = coins.find(function(d) { return d.name.toLowerCase() === id; });
  if (!c) return;
  document.getElementById('wName').textContent = c.name;
  document.getElementById('wPrice').textContent = fmtPrice(c.price);
  var el = document.getElementById('wChange'), up = c.change >= 0;
  el.className = 'wchange ' + (up ? 'up' : 'down');
  el.innerHTML = (up ? '▲' : '▼') + ' ' + Math.abs(c.change).toFixed(2) + '% <span class="per">(24h)</span>';
  document.getElementById('wIcon').className = 'ci ' + c.cls;
  document.getElementById('wIcon').textContent = c.icon;
  buildSide();
  drawHomeChart();
}

function drawHomeChart() {
  var c = coins.find(function(d) { return d.name.toLowerCase() === currentWatch; });
  var trend = c ? c.trend : 'up';
  var canvas = document.getElementById('homeChart');
  var ctx = canvas.getContext('2d'), dpr = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr; canvas.height = rect.height * dpr; ctx.scale(dpr, dpr);
  var w = rect.width, h = rect.height, pts = []; var v = h * 0.5;
  for (var i = 0; i <= 120; i++) { v += (Math.random() - (trend === 'up' ? 0.42 : 0.58)) * (h * 0.05); v = Math.max(h * 0.08, Math.min(h * 0.88, v)); pts.push({x: (i / 120) * w, y: v}); }
  var g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, 'rgba(0,180,100,0.5)'); g.addColorStop(0.4, 'rgba(0,200,150,0.3)'); g.addColorStop(1, 'rgba(0,220,240,0.08)');
  ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
  for (var i = 1; i < pts.length; i++) { var cx = (pts[i-1].x + pts[i].x) / 2; ctx.bezierCurveTo(cx, pts[i-1].y, cx, pts[i].y, pts[i].x, pts[i].y); }
  ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.closePath(); ctx.fillStyle = g; ctx.fill();
  ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
  for (var i = 1; i < pts.length; i++) { var cx = (pts[i-1].x + pts[i].x) / 2; ctx.bezierCurveTo(cx, pts[i-1].y, cx, pts[i].y, pts[i].x, pts[i].y); }
  ctx.strokeStyle = '#00cc66'; ctx.lineWidth = 2; ctx.stroke();
}

// ==================== TABLE ====================
function renderTable(data) {
  document.getElementById('tBody').innerHTML = data.map(function(c) {
    var id = c.pair ? (c.pair.chainId + '::' + c.pair.pairAddress) : c.name.toLowerCase();
    var priceStr = c.price ? fmtPrice(c.price) : '--';
    return '<tr onclick="openDetail(\'' + id.replace(/'/g, "\\'") + '\')">' +
      '<td><span class="rn">' + c.rank + '</span><span class="ea">◆</span></td>' +
      '<td><div class="cnc"><div class="ci ' + c.cls + '">' + c.icon + '</div><span class="cnt">' + c.name + '</span></div></td>' +
      '<td style="font-weight:800">' + priceStr + '</td>' +
      '<td><div class="chc ' + (c.change >= 0 ? 'up' : 'down') + '">' + (c.change >= 0 ? '▲' : '▼') + ' ' + Math.abs(c.change).toFixed(2) + '%</div></td>' +
      '<td class="mc">' + c.mcap + '</td>' +
      '<td class="slc">' + mkSpk(c.trend) + '</td>' +
    '</tr>';
  }).join('');
}

function mkSpk(t) {
  var p = []; var v = 50;
  for (var i = 0; i < 24; i++) { v += (Math.random() - (t === 'up' ? 0.4 : 0.6)) * 8; v = Math.max(8, Math.min(92, v)); p.push(v); }
  var d = p.map(function(y, i) { return (i === 0 ? 'M' : 'L') + ((i / 23) * 100) + ',' + (100 - y); }).join(' ');
  return '<svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="' + d + '" fill="none" stroke="' + (t === 'up' ? '#00aa44' : '#cc2222') + '" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}

// ==================== SEARCH (DexScreener API) ====================
var searchTimeout = null;

function filterTable() {
  var q = document.getElementById('searchBox').value.trim();
  if (!q) {
    // Reset to default coin list
    displayCoins = coins;
    isShowingSearch = false;
    renderTable(coins);
    return;
  }

  // Local filter first
  var local = coins.filter(function(c) {
    return c.name.toLowerCase().includes(q.toLowerCase()) || c.symbol.toLowerCase().includes(q.toLowerCase());
  });
  if (local.length > 0 && q.length < 20) {
    displayCoins = local;
    isShowingSearch = false;
    renderTable(local);
  }

  // Debounced DexScreener search for longer queries or contract addresses
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(function() { dexSearch(q); }, 500);
}

async function dexSearch(q) {
  try {
    var pairs;
    if (q.length > 30 && !q.includes(' ')) {
      // Contract address lookup
      var data = await apiFetch('/tokens/v1/' + encodeURIComponent(q));
      pairs = Array.isArray(data) ? data : (data.pairs || []);
    } else {
      var data = await apiFetch('/latest/dex/search?q=' + encodeURIComponent(q));
      pairs = data.pairs || [];
    }

    if (!pairs.length) return;

    // Deduplicate by base token
    var seen = {};
    pairs.forEach(function(p) {
      var addr = ((p.baseToken || {}).address || '').toLowerCase();
      var liq = ((p.liquidity || {}).usd) || 0;
      if (!seen[addr] || liq > (((seen[addr].liquidity || {}).usd) || 0)) {
        seen[addr] = p;
      }
    });

    var unique = Object.values(seen)
      .sort(function(a, b) { return (((b.liquidity || {}).usd) || 0) - (((a.liquidity || {}).usd) || 0); })
      .slice(0, 15);

    // Map DexScreener results to the coins format for the table
    var iconColors = ['btc','eth','bnb','sol','xrp','ada','doge','avax','dot','link'];
    searchResults = unique.map(function(p, i) {
      var base = p.baseToken || {};
      var sym = (base.symbol || '???').toUpperCase();
      var chg = ((p.priceChange || {}).h24) || 0;
      return {
        rank: i + 1,
        name: base.name || sym,
        symbol: sym,
        icon: sym.charAt(0),
        cls: iconColors[i % iconColors.length],
        price: parseFloat(p.priceUsd) || 0,
        change: chg,
        mcap: fmtVol(p.marketCap),
        fdv: fmtVol(p.fdv),
        vol: fmtVol(((p.volume || {}).h24) || 0),
        volH24: ((p.volume || {}).h24) || 0,
        liq: fmtVol(((p.liquidity || {}).usd) || 0),
        trend: chg >= 0 ? 'up' : 'down',
        pair: p
      };
    });

    // Only update if search box still has same query
    if (document.getElementById('searchBox').value.trim() === q) {
      displayCoins = searchResults;
      isShowingSearch = true;
      renderTable(searchResults);
    }
  } catch (e) {
    // Silently fail for search
  }
}

// Also search on Enter key
document.getElementById('searchBox').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    clearTimeout(searchTimeout);
    var q = this.value.trim();
    if (q) dexSearch(q);
  }
});

// ==================== DETAIL PAGE (DexScreener API) ====================
var detailCoin = null, chartPoints = [];

async function openDetail(id) {
  document.getElementById('homePage').classList.remove('active');
  document.getElementById('detailPage').classList.add('active');
  document.getElementById('viewToggle').style.display = 'none';

  // Check if id is "chainId::pairAddress" format (from API result)
  if (id.includes('::')) {
    var parts = id.split('::');
    var chainId = parts[0];
    var pairAddress = parts[1];

    // Find in current display data first
    detailCoin = displayCoins.find(function(c) {
      return c.pair && c.pair.chainId === chainId && c.pair.pairAddress === pairAddress;
    });

    // Fetch fresh data from API
    try {
      var data = await apiFetch('/latest/dex/pairs/' + chainId + '/' + pairAddress);
      var pair = (data.pairs || [])[0];
      if (pair) {
        var base = pair.baseToken || {};
        var chg = ((pair.priceChange || {}).h24) || 0;
        if (!detailCoin) {
          detailCoin = {
            name: base.name || base.symbol || '???',
            symbol: base.symbol || '???',
            icon: (base.symbol || '?').charAt(0),
            cls: 'btc',
            pair: pair
          };
        }
        detailCoin.price = parseFloat(pair.priceUsd) || 0;
        detailCoin.change = chg;
        detailCoin.trend = chg >= 0 ? 'up' : 'down';
        detailCoin.mcap = fmtVol(pair.marketCap);
        detailCoin.fdv = fmtVol(pair.fdv);
        detailCoin.vol = fmtVol(((pair.volume || {}).h24) || 0);
        detailCoin.volH24 = ((pair.volume || {}).h24) || 0;
        detailCoin.liq = fmtVol(((pair.liquidity || {}).usd) || 0);
        detailCoin.pair = pair;
      }
    } catch (e) { /* use cached data */ }
  } else {
    // Legacy: find by name from coins list
    detailCoin = coins.find(function(c) { return c.name.toLowerCase() === id; });
  }

  if (!detailCoin) {
    document.getElementById('dName').textContent = 'Not Found';
    return;
  }

  // Populate detail UI
  document.getElementById('dName').textContent = detailCoin.name;
  document.getElementById('dSym').textContent = detailCoin.symbol;
  document.getElementById('dPrice').textContent = fmtPrice(detailCoin.price);
  document.getElementById('dIcon').className = 'ci ' + detailCoin.cls;
  document.getElementById('dIcon').textContent = detailCoin.icon;

  var badge = document.getElementById('dBadge');
  var up = detailCoin.change >= 0;
  badge.className = 'detail-badge ' + (up ? 'up' : 'down');
  badge.textContent = (up ? '+' : '') + detailCoin.change.toFixed(2) + '%';

  // Key stats from DexScreener data
  var pair = detailCoin.pair;
  var txns = pair ? ((pair.txns || {}).h24 || {}) : {};
  var buys = txns.buys || 0;
  var sells = txns.sells || 0;
  var chg5m = pair ? ((pair.priceChange || {}).m5 || 0) : 0;
  var chg1h = pair ? ((pair.priceChange || {}).h1 || 0) : 0;
  var dexName = pair ? (pair.dexId || '--') : '--';
  var chainName = pair ? (pair.chainId || '--') : '--';

  document.getElementById('ksGrid').innerHTML =
    '<div class="ks-item"><div class="ks-title">MARKET CAP</div><div class="ks-value">' + detailCoin.mcap + '</div></div>' +
    '<div class="ks-item"><div class="ks-title">FDV</div><div class="ks-value">' + detailCoin.fdv + '</div></div>' +
    '<div class="ks-item"><div class="ks-title">VOLUME 24H</div><div class="ks-value">' + detailCoin.vol + '</div></div>' +
    '<div class="ks-item"><div class="ks-title">LIQUIDITY</div><div class="ks-value">' + detailCoin.liq + '</div></div>' +
    '<div class="ks-item"><div class="ks-title">BUYS / SELLS</div><div class="ks-value">' + buys.toLocaleString() + ' / ' + sells.toLocaleString() + '</div><div class="ks-sub">24h txns</div></div>' +
    '<div class="ks-item"><div class="ks-title">CHAIN / DEX</div><div class="ks-value" style="font-size:0.8rem">' + chainName + '</div><div class="ks-sub">' + dexName + '</div></div>';

  // Time range buttons
  document.querySelectorAll('.tr-btn').forEach(function(b) {
    b.onclick = function() {
      document.querySelectorAll('.tr-btn').forEach(function(x) { x.classList.remove('active'); });
      b.classList.add('active');
      drawDetailChart();
    };
  });

  setTimeout(function() { drawDetailChart(); }, 80);
}

function drawDetailChart() {
  var canvas = document.getElementById('dChart');
  var ctx = canvas.getContext('2d'), dpr = window.devicePixelRatio || 1;
  var wrap = document.getElementById('dChartWrap');
  var rect = wrap.getBoundingClientRect();
  canvas.width = rect.width * dpr; canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);
  var w = rect.width - 60, h = rect.height - 30;

  // Generate simulated data based on real trend direction
  chartPoints = []; var v = h * 0.6;
  var trend = detailCoin ? detailCoin.trend : 'up';
  for (var i = 0; i <= 200; i++) {
    v += (Math.random() - (trend === 'up' ? 0.43 : 0.57)) * (h * 0.04);
    v = Math.max(h * 0.05, Math.min(h * 0.92, v));
    chartPoints.push({x: (i / 200) * w, y: v});
  }

  // Grid
  ctx.strokeStyle = 'rgba(0,255,136,0.06)'; ctx.lineWidth = 0.5;
  for (var i = 0; i <= 10; i++) { var y = (i / 10) * h; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
  for (var i = 0; i <= 12; i++) { var x = (i / 12) * w; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }

  // Glow fill
  var glowGrad = ctx.createLinearGradient(0, 0, 0, h);
  glowGrad.addColorStop(0, 'rgba(0,255,136,0.25)');
  glowGrad.addColorStop(0.4, 'rgba(0,200,120,0.15)');
  glowGrad.addColorStop(0.7, 'rgba(0,180,100,0.06)');
  glowGrad.addColorStop(1, 'rgba(0,150,80,0.01)');

  ctx.beginPath(); ctx.moveTo(chartPoints[0].x, chartPoints[0].y);
  for (var i = 1; i < chartPoints.length; i++) { var cx = (chartPoints[i-1].x + chartPoints[i].x) / 2; ctx.bezierCurveTo(cx, chartPoints[i-1].y, cx, chartPoints[i].y, chartPoints[i].x, chartPoints[i].y); }
  ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.closePath(); ctx.fillStyle = glowGrad; ctx.fill();

  // Line with glow
  ctx.shadowColor = 'rgba(0,255,136,0.6)'; ctx.shadowBlur = 8;
  ctx.beginPath(); ctx.moveTo(chartPoints[0].x, chartPoints[0].y);
  for (var i = 1; i < chartPoints.length; i++) { var cx = (chartPoints[i-1].x + chartPoints[i].x) / 2; ctx.bezierCurveTo(cx, chartPoints[i-1].y, cx, chartPoints[i].y, chartPoints[i].x, chartPoints[i].y); }
  ctx.strokeStyle = '#00ff88'; ctx.lineWidth = 2; ctx.stroke();
  ctx.shadowBlur = 0;

  // White highlight
  ctx.beginPath(); ctx.moveTo(chartPoints[0].x, chartPoints[0].y - 1);
  for (var i = 1; i < chartPoints.length; i++) { var cx = (chartPoints[i-1].x + chartPoints[i].x) / 2; ctx.bezierCurveTo(cx, chartPoints[i-1].y - 1, cx, chartPoints[i].y - 1, chartPoints[i].x, chartPoints[i].y - 1); }
  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 0.8; ctx.stroke();

  // Dotted current price line
  var lastY = chartPoints[chartPoints.length - 1].y;
  ctx.setLineDash([4, 4]); ctx.strokeStyle = 'rgba(0,255,136,0.3)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, lastY); ctx.lineTo(w, lastY); ctx.stroke();
  ctx.setLineDash([]);

  // Bright dots at peaks
  for (var i = 2; i < chartPoints.length - 2; i++) {
    if (chartPoints[i].y < chartPoints[i-1].y && chartPoints[i].y < chartPoints[i+1].y && Math.random() > 0.7) {
      ctx.beginPath(); ctx.arc(chartPoints[i].x, chartPoints[i].y, 2, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,255,200,0.7)'; ctx.fill();
    }
  }

  // Price axis using real price
  var pBase = detailCoin ? detailCoin.price : 1;
  var pRange = pBase * 0.08;
  var axis = document.getElementById('priceAxis');
  var ticks = '';
  for (var i = 0; i <= 8; i++) {
    var pv = pBase + pRange * (1 - i / 4);
    if (pv >= 1000) ticks += '<div class="price-tick">$' + (pv / 1000).toFixed(1) + 'K</div>';
    else if (pv >= 1) ticks += '<div class="price-tick">$' + pv.toFixed(2) + '</div>';
    else ticks += '<div class="price-tick">$' + pv.toFixed(4) + '</div>';
  }
  axis.innerHTML = ticks;

  // Current price label position
  var pnow = document.getElementById('priceNow');
  var pct = lastY / h;
  pnow.style.top = Math.min(Math.max(pct * 100, 5), 90) + '%';
  if (pBase >= 1000) pnow.textContent = '$' + (pBase / 1000).toFixed(1) + 'K';
  else if (pBase >= 1) pnow.textContent = '$' + pBase.toFixed(2);
  else pnow.textContent = '$' + pBase.toFixed(4);

  // Time axis
  var times = ['18:31','21:00','23:55','03:01','06:00','09:00','12:01','18:01'];
  document.getElementById('timeAxis').innerHTML = times.map(function(t) { return '<span class="time-tick">' + t + '</span>'; }).join('');
}

// Crosshair on hover
document.getElementById('dChartWrap').addEventListener('mousemove', function(e) {
  var wrap = document.getElementById('dChartWrap');
  var rect = wrap.getBoundingClientRect();
  var x = e.clientX - rect.left;
  var cv = document.getElementById('crossV');
  cv.style.display = 'block'; cv.style.left = x + 'px';
  var pct = x / rect.width;
  var hours = Math.floor(pct * 24); var mins = Math.floor((pct * 24 - hours) * 60);
  document.getElementById('crossLabel').textContent = String(hours).padStart(2, '0') + ':' + String(mins).padStart(2, '0');
});
document.getElementById('dChartWrap').addEventListener('mouseleave', function() {
  document.getElementById('crossV').style.display = 'none';
});
